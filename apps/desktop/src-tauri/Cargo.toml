[package]
name = "thetrimmer-desktop"
description = "TheTrimmer desktop shell: typed IPC over the application layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "thetrimmer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# The window. Named explicitly so the binary and the library can both be built, which is what lets
# the commands be unit-tested without opening one.
name = "thetrimmer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
trimmer-core.workspace = true
trimmer-media.workspace = true
trimmer-verify.workspace = true
trimmer-export.workspace = true
trimmer-store.workspace = true
trimmer-app.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
parking_lot.workspace = true
uuid.workspace = true
