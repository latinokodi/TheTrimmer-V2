[package]
name = "thetrimmer-desktop"
description = "TheTrimmer desktop shell: typed IPC over the application layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "thetrimmer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Deliberately NOT `thetrimmer`: that name belongs to the command line. Two crates producing a binary
# of the same name is a collision Cargo resolves silently — one overwrites the other in `target/`,
# and which wins depends on build order. That is exactly what happened: the desktop binary took the
# name, so `thetrimmer doctor` opened a window instead of printing a report, and the window showed a
# connection error because it was looking for a dev server. A product whose command-line tool opens a
# GUI is a bug nobody thinks to look for, and the fix is to make the names unambiguous.
name = "thetrimmer-desktop"
path = "src/main.rs"

[features]
# This is the feature that decides whether the window loads the compiled interface or looks for a
# development server, and leaving it out is not a build error — it is a window that opens, cannot
# reach `localhost:5173`, and shows a browser connection error. `tauri`'s own build script reads it:
# without `custom-protocol`, `cfg(dev)` is set and `tauri.conf.json`'s `devUrl` is baked in instead
# of `frontendDist`.
#
# `default` includes it so a plain `cargo build --release` produces a working application. The
# `tauri` CLI passes it too when it runs `tauri build`, so either route works; the point is that the
# obvious command is not the broken one.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
trimmer-core.workspace = true
trimmer-media.workspace = true
trimmer-verify.workspace = true
trimmer-export.workspace = true
trimmer-store.workspace = true
trimmer-app.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
parking_lot.workspace = true
uuid.workspace = true

[dev-dependencies]
# `tauri`'s `test` feature provides the mock runtime and `get_ipc_response`, which is what lets
# `tests/ipc_contract.rs` drive the real invoke handler without opening a window.
tauri = { version = "2", features = ["test"] }
