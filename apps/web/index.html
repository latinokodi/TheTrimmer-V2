<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The page never loads anything from the network. `default-src 'self'` and `script-src 'self'`
      mirror the Tauri capability, so a mistake in the shell cannot silently become a remote fetch.
      `style-src` needs `unsafe-inline` because a virtualised list sets row offsets as inline styles;
      there is no user-authored CSS and no `innerHTML` anywhere in the interface.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' asset: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>TheTrimmer</title>
  </head>
  <body>
    <!--
      A visible fallback for the window between the page loading and React mounting. Without it a
      slow first paint is a white rectangle, which reads as a crash.
    -->
    <div id="root">
      <div class="boot">
        <p class="boot__title">TheTrimmer</p>
        <p class="boot__note">Starting…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
