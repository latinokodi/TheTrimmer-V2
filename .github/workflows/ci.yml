name: ci

# What this pipeline is for, and what it deliberately is not.
#
# It runs on every push and pull request, on Windows only, and it checks four things in the order
# that a failure is cheapest to fix: formatting, lints, the test suite, and a *real cut*. That last
# step is the point of the whole file. Everything else in this workspace tests a decision; the
# end-to-end test generates a clip with ffmpeg, cuts a segment through the head-patch method, and
# asserts that the copied body is byte-identical to the source and that the head landed on the mark.
# It is the only check that would have caught the two defects that cost the most time in V1 — a
# missing `-video_track_timescale` producing slow motion with exit code 0, and `-frames:v` dropping a
# frame in decode order — and it is the reason the runner is `windows-latest` rather than something
# cheaper.
#
# The differential oracle runs here too, and it needs the V1 engine. That checkout is not in this
# repository, so the job fetches it and skips the oracle loudly when it cannot: a test that cannot
# tell "not applicable" from "the engine is wrong" gets deleted by the first person it
# inconveniences.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Fail on a warning rather than letting one accumulate.
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      # ffmpeg is what the end-to-end test cuts with, and what the product cannot run without.
      # `choco` is the fastest route on a GitHub Windows runner.
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
        shell: pwsh

      - name: Report the toolchain
        run: |
          rustc --version
          cargo --version
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
        shell: pwsh

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Two crates producing a binary of the same name is resolved silently by Cargo: one overwrites
      # the other, and which wins depends on build order. That made `thetrimmer doctor` open a GUI.
      # `crates/trimmer-cli/tests/workspace_shape.rs` asserts this, and the step below is the same
      # check at the point where the artifacts are actually produced.
      - name: No duplicate binary names
        run: |
          $names = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            ForEach-Object { $_.targets } | Where-Object { $_.kind -contains 'bin' } |
            ForEach-Object { $_.name }
          $dupes = $names | Group-Object | Where-Object { $_.Count -gt 1 }
          if ($dupes) {
            $dupes | ForEach-Object { Write-Error "binary $($_.Name) is produced $($_.Count) times" }
            exit 1
          }
          Write-Host "$($names.Count) distinct binaries"
        shell: pwsh

      # The V1 engine, for the differential oracle. A failure here is not fatal: the oracle skips
      # with a printed reason, and the job says so rather than pretending it ran.
      - name: Fetch the V1 engine for the oracle
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/thetrimmer/thetrimmer-v1 "$env:RUNNER_TEMP\thetrimmer-v1"
          echo "THE_TRIMMER_V1_ROOT=$env:RUNNER_TEMP\thetrimmer-v1" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Tests
        run: cargo test --workspace --all-targets
        shell: pwsh

      - name: A real cut
        run: |
          # Named explicitly so the media path is exercised even if a future change to the test
          # filter would otherwise skip it.
          cargo test -p trimmer-media --test end_to_end -- --nocapture
        shell: pwsh

      # The window's own contract: the same command names, argument keys and reply fields that
      # `apps/web` sends and reads, driven through Tauri's real invoke handler. Everything else in
      # this file tests the *engine*, and every one of those tests would pass if a command were
      # registered under the wrong name or answered a JSON key the interface does not read — which is
      # a window that renders perfectly and does nothing when clicked. Three such mismatches were
      # found the first time this ran: `add_source` answered a different shape from the `sources`
      # command, the verification policy refused to answer before a project was open, and an Out point
      # marked in the window produced a segment one frame longer than the dialog promised.
      #
      # The browser suite in the `web` job cannot catch any of those: its stub agrees with the
      # interface by construction. The two jobs test two different things on purpose.
      #
      # It is `--ignored` because it generates and cuts real media; it is named explicitly so it
      # cannot be skipped by a filter change. It used to be `--test-threads=1`, because each test set
      # `THE_TRIMMER_STORE` before constructing its state and the variable is process-global, so the
      # tests raced and one could open another's database. They no longer share it — `bootstrap_at`
      # takes the path — so serialising them is gone. Leaving it in would have hidden the next race
      # instead of preventing it.
      #
      # `every_command_the_interface_names_is_registered` is the one test in that file that is *not*
      # ignored, so it also runs in the step above; that is deliberate, because it reads the
      # interface's own `COMMAND_NAMES` and needs no media.
      - name: The interface's own contract
        run: |
          cargo test -p thetrimmer-desktop --test ipc_contract -- --ignored --nocapture
        shell: pwsh

  web:
    name: web
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      # Chromium is the engine WebView2 uses, so this is the rendering path the window takes.
      - name: Install the browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Types
        working-directory: apps/web
        run: npx tsc --noEmit

      # The part of the interface that makes a claim: every number a cutter reads comes out of
      # `lib/format`, and a formatter that is wrong is a number a person trusts and should not.
      - name: Unit tests
        working-directory: apps/web
        run: npm test

      # The interface driven as a person drives it, with no Rust, no WebView2 and no build — the loop
      # that makes interface work cost seconds instead of minutes. It proves behaviour; the IPC
      # contract job above proves the shape of what Rust sends, which this cannot see.
      - name: Browser tests
        working-directory: apps/web
        run: npm run e2e

      # The browser stub lives in this bundle or it does not, and the answer decides whether the
      # shipped window does anything at all: for several revisions it did not, because the stub was in
      # the production build and answered every command from a fixture. `npm run build` therefore ends
      # by running `tools/check-bundle.mjs`, which opens the built files and fails if any trace of the
      # stub is in them. This step is where that guarantee is enforced on every push.
      - name: Build
        working-directory: apps/web
        run: npm run build

  # The window itself, built and started.
  #
  # This job exists because of a class of defect no other job can see. Three separate faults once
  # produced the same symptom — a window that opened, could not load the interface, and showed
  # `ERR_CONNECTION_REFUSED`: a missing `custom-protocol` feature, a `frontendDist` one directory
  # short, and a missing `withGlobalTauri`. All three would have shipped green through 404 Rust tests,
  # a browser suite and a real media cut, because every one of those tests the *interface* or the
  # *engine* and none of them starts the application.
  #
  # `tools/smoke-window.ps1` starts the built window and asks it six questions: did the interface
  # render from the assets just built; is the bridge Rust rather than the browser fixture; did the
  # commands the window calls on mount answer; does the window have a titlebar it can be restored,
  # minimized and closed from; does the file picker open; and does it close when asked to close.
  #
  # The third and fourth exist because the second was missing for several revisions. The check that
  # *was* here — "the footer reports what `doctor` returned" — passed on a hard-coded ffmpeg build
  # string, because the browser stub was in the production bundle and answered `doctor` itself. Every
  # test in this file was green while the shipped application did nothing at all. A check that a
  # fixture can satisfy is not a check, so the smoke test now asserts the absence of the fixture and
  # the presence of the picker, neither of which a stub can fake.
  #
  # The window question is asked of Windows rather than of Tauri for the same reason. `isDecorated()`,
  # `isMinimizable()`, `isMaximizable()` and `isClosable()` all answered `true` on a window with no
  # caption, no system menu and no minimize or maximize box, because Tauri reports the window that was
  # *requested*. Only the style bits describe the window that exists.
  desktop:
    name: desktop
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [rust, web]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
        shell: pwsh

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build the interface
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build the window
        run: cargo build --release -p thetrimmer-desktop

      # WebView2 is on Windows 11 and on patched Windows 10; the runner image has it.
      - name: Start the window and check it
        run: pwsh -File tools/smoke-window.ps1
        shell: pwsh

      # The four binaries are the product. There is no installer: the window embeds its interface and
      # resolves ffmpeg from PATH, so it is one file that runs from anywhere, and `start.bat` in the
      # repository root builds and starts it.
      - uses: actions/upload-artifact@v4
        with:
          name: thetrimmer-windows
          path: |
            target/release/thetrimmer-desktop.exe
            target/release/thetrimmer.exe
            target/release/ttrim.exe
            target/release/trimmer-daemon.exe
          if-no-files-found: error

