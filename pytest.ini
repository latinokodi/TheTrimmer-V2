[pytest]
testpaths = backend/tests

# pytest-bdd 8 registers its step fixtures the old way and warns once per scenario. The warning
# is about a pytest 10 removal inside pytest-bdd's own code, not in this project, and thirty
# copies of it on every run is noise that hides the warnings that do matter. Suppressed by
# message rather than by category, so a deprecation of ours still shows up.
filterwarnings =
    ignore:Passing nodeid to _register_fixture is deprecated
    ignore:Passing baseid to FixtureDef is deprecated
