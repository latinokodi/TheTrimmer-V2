[package]
name = "trimmer-app"
description = "Application layer: the workspace model, transcript service, watch-folder rules and the batch queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
trimmer-core.workspace = true
trimmer-media.workspace = true
trimmer-verify.workspace = true
trimmer-export.workspace = true
# `async_trait` so `MediaEngine` can be a `dyn` object: the queue and the workspace hold an
# engine behind an `Arc`, which native `async fn` in traits cannot do without boxing by hand.
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
# The integration test implements the async engine trait, which needs the same macro the crate
# uses; it is a dev-dependency so the library itself does not require it at the call site.
async-trait = "0.1"
