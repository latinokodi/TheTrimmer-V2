[package]
name = "trimmer-export"
description = "Timeline export: Premiere xmeml, FCPXML, CMX3600 EDL and CSV, built as pure text from a project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
trimmer-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
quick-xml.workspace = true
time.workspace = true

# Lint policy lives in `src/lib.rs` as crate-root attributes rather than here, for the same
# reason as `trimmer-core`: attributes at the crate root are unambiguous and greppable, while
# a `[lints]` table is a Cargo-level setting whose interaction with a virtual workspace root
# is easy to get subtly wrong.
