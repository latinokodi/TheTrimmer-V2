[package]
name = "trimmer-daemon"
description = "The headless local API: a bearer-token HTTP/JSON control surface over the store, the queue and the verifier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
trimmer-core.workspace = true
trimmer-media.workspace = true
trimmer-verify.workspace = true
trimmer-export.workspace = true
trimmer-app.workspace = true
trimmer-store.workspace = true
anyhow.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
time.workspace = true

[dev-dependencies]
# `ServiceExt::oneshot` drives the router without a socket, which is what lets the whole API be
# tested in-process rather than over a port that a parallel test run might collide on.
tower.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
