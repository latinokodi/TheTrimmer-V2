[package]
name = "trimmer-license"
description = "Offline signed licensing: editions, capability gating, machine binding, and a pasteable key."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# `trimmer-core` is deliberately *not* a dependency. The brief for this crate listed it, and it
# is not used: nothing in the licensing domain needs a domain type — a licence talks about
# editions, seats and features, and a machine id is a hash. A dependency that nothing names is
# a false statement about the dependency graph, so it is left out rather than added to match a
# list. See the crate report.
