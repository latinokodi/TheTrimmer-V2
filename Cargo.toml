[workspace]
resolver = "2"
members = [
    "crates/trimmer-core",
    # Added as they are built, so the workspace always compiles:
    "crates/trimmer-media",
    "crates/trimmer-verify",
    "crates/trimmer-export",
    "crates/trimmer-app",
    "crates/trimmer-store",
    "crates/trimmer-license",
    "crates/trimmer-daemon",
    # "crates/trimmer-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
authors = ["TheTrimmer"]
repository = "https://github.com/thetrimmer/thetrimmer"
description = "Frame-exact, verified segment cutting for professional post-production."

[workspace.dependencies]
trimmer-core = { path = "crates/trimmer-core" }
trimmer-media = { path = "crates/trimmer-media" }
trimmer-verify = { path = "crates/trimmer-verify" }
trimmer-export = { path = "crates/trimmer-export" }
trimmer-store = { path = "crates/trimmer-store" }
trimmer-app = { path = "crates/trimmer-app" }
trimmer-license = { path = "crates/trimmer-license" }
trimmer-cli = { path = "crates/trimmer-cli" }
trimmer-daemon = { path = "crates/trimmer-daemon" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "signal", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json", "chrono"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
tracing-appender = "0.2"
notify = "6"
notify-debouncer-full = "0.4"
directories = "5"
parking_lot = "0.12"
quick-xml = { version = "0.36", features = ["serialize"] }
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Dev and test builds unwind by default, which is what the differential oracle and the
# integration suite need in order to catch a panic per case rather than abort the run.
[profile.dev]
panic = "unwind"

[profile.dev.package."*"]
opt-level = 1
